name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: pnpm --dir web run lint
      - run: ./scripts/spdx-lint.sh
      - run: ./scripts/i18n-lint.sh
      - run: ./scripts/dco-check.sh origin/${{ github.base_ref || 'main' }} HEAD
        if: github.event_name == 'pull_request'

  # docs/08 has specified "govulncheck / npm audit in CI" since Phase 0 and
  # nothing implemented it, which is how golang.org/x/text sat two minor
  # versions behind a reachable advisory (GO-2026-5970) through all of Phase 1.
  # The stale dependency was the symptom; this job is the fix (WP-1.10).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install

      # Blocking. govulncheck reports only advisories whose vulnerable symbols
      # are actually reachable from this code, so a finding here is a real
      # exposure and not a graph-shaped rumour.
      - name: go vulnerabilities (blocking)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Blocking, production dependencies only: nothing vulnerable may reach the
      # shipped bundle.
      - name: npm vulnerabilities, production (blocking)
        run: pnpm --dir web audit --prod --audit-level=low

      # Non-blocking, whole tree. Dev tooling advisories are real but they are
      # not a shipped vulnerability, and a gate that fails the build because a
      # test runner's transitive dependency published an advisory this morning
      # is a gate that gets switched off. The tree is clean as of WP-1.10 (pnpm
      # overrides in package.json), so anything appearing here is news.
      - name: npm vulnerabilities, all (report only)
        run: pnpm --dir web audit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install
      - run: go test ./...
      - run: pnpm --dir web run test
      # Performance budgets (docs/09, WP-1.5 AC): interactive read p95 < 100ms,
      # write p95 < 300ms, measured over a real HTTP listener against the
      # fully-wired product handler. A regression fails the build.
      - name: performance budget smoke
        run: go test -count=1 -tags perf ./internal/app

  # End-to-end on the shipped artefact: a compiled binary serving the built web
  # bundle from one origin, driven through a real browser. Every flow also runs
  # an axe-core scan — WCAG 2.2 AA is a CI gate from WP-1.5 onward (docs/17).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install -g pnpm@9.15.0
      - run: pnpm install
      - run: pnpm --dir web run build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The Integrity Gauntlet (docs/19 §3): a dedicated, non-skippable gate for
  # data-integrity enforcement. v1 runs the invariant registry gate (every
  # required INV-* has a tagged test) and the adversarial writer suite
  # (append-only role separation + triggers, RLS cross-tenant, optimistic
  # concurrency) on Postgres AND SQLite. The heavier nightly tiers named in
  # docs/19 — mutation, chaos, fuzz — are WP-6.7. No green gauntlet, no merge.
  integrity-gauntlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: run integrity gauntlet
        # Auto-discovery (WP-0.10): every INV/adversarial/composability test
        # file is tagged `//go:build integrity`, so new module invariant tests
        # join the gauntlet by adding the tag — no edit here. Includes the
        # composability suite (ADR-018 §7): every shipped profile boots,
        # closures resolve, disabled objects return capability-disabled.
        #
        # -p 2 caps how many package binaries run at once. At the default (one
        # per core) this suite puts ~20 Docker-heavy packages on a 4-core
        # runner, and the contention is not evenly felt: kernel/eventstore's
        # 1000-writer SQLite torture starves under it and fails on the
        # busy-retry budget rather than on the invariant it exists to check —
        # a false negative on a non-skippable gate. The same shape was already
        # observed with parallel Docker locally (phase-1-review.md P3).
        #
        # The cost is wall-clock: the gauntlet is the slowest job either way,
        # and this trades some of that for a result that means what it says.
        run: go test -count=1 -tags integrity -p 2 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: build solo binary
        run: go build -o bin/lasterp ./cmd/lasterp
      - name: build docker image
        run: docker build -f deploy/Dockerfile -t lasterp:ci .
      - uses: azure/setup-helm@v5
      - name: lint helm chart
        run: helm lint deploy/helm/lasterp
