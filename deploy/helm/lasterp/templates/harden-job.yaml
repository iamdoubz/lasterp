{{- if .Values.hardenJob.enabled }}
# Migrate and harden before the Deployment rolls (docs/19 §2, WP-1.10).
#
# It is a hook rather than an ordinary Job so it completes before pods that
# depend on the schema start, and so an upgrade re-applies the grants: a new
# migration can add a protected table, and a grant that was never re-applied is
# a hole nobody notices until an audit.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-lasterp-harden
  labels:
    app: {{ .Release.Name }}-lasterp
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-lasterp-harden
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: LASTERP_DSN
              value: {{ .Values.database.ownerDsn | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-lasterp-harden-grants
  labels:
    app: {{ .Release.Name }}-lasterp
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-lasterp-harden
    spec:
      restartPolicy: Never
      containers:
        - name: harden
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "harden"
            - "--app-role"
            - {{ .Values.database.appRole | quote }}
            {{- if .Values.database.createRole }}
            - "--create-role"
            {{- end }}
          env:
            - name: LASTERP_DSN
              value: {{ .Values.database.ownerDsn | quote }}
            - name: LASTERP_APP_PASSWORD
              value: {{ .Values.database.appPassword | quote }}
{{- end }}
